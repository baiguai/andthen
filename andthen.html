<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AndThen — Vertical Timeline Editor</title>
  <style>
    :root{
      --bg: #000;
      --fg: #fff;
      --line: #fff;
      --border: dimgray; /* flat 1px dim gray borders */
    }
    html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;}

    /* Editor container */
    #editor{height:100vh; overflow:auto; box-sizing:border-box;}

    /* Centered timeline column */
    .timeline{position:relative; width:100%; max-width:900px; margin:0 auto; padding:48px 20px; box-sizing:border-box;}

    /* The vertical white line (1px) — it fills the timeline height (extends as events are added) */
    .timeline .line{position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--line); transform:translateX(-50%);} 

    /* Stacks events vertically. Its height grows with content; the .line matches it. */
    .events{position:relative; display:flex; flex-direction:column; gap:28px;}

    /* Each event occupies the full width but its content is boxed left or right of the center line */
    .event{position:relative; display:flex; width:100%; align-items:flex-start;}
    .box{border:1px solid var(--border); padding:10px 12px; color:var(--fg); max-width:46%; box-sizing:border-box; background:transparent; border-radius:0;}

    /* Left and right alignment relative to the center line */
    .event.left{justify-content:flex-end;}        /* box to the left side */
    .event.right{justify-content:flex-start;}      /* box to the right side */
    .event.left .box{ text-align:right; }
    .event.right .box{ text-align:left; }

    /* Small connector dot at the center line for each event */
    .point{position:absolute; left:50%; transform:translate(-50%, -50%); width:10px; height:10px; border:1px solid var(--border); background:var(--bg); box-sizing:border-box;}

    /* Editable content style */
    .box[contenteditable]{outline:none; caret-color:var(--fg);} 

    /* Make sure text selection looks ok on black */
    ::selection{background:#444; color:var(--fg);} 

    /* Remove default focus ring while keeping accessibility via keyboard */
    .box:focus{box-shadow:0 0 0 1px rgba(255,255,255,0.06);}

    /* Minimal responsive tweaks */
    @media (max-width:640px){
      .box{max-width:72%;}
    }
  </style>
</head>
<body>
  <div id="editor">
    <div class="timeline">
      <div class="line" aria-hidden="true"></div>
      <div class="events" id="events"></div>
    </div>
  </div>

  <script>
    // Timeline Editor (minimal)
    // - White on black theme
    // - Center vertical line (1px) automatically extends as events are added
    // - Flat 1px dim gray borders for event boxes
    // - Simple 'a' keybinding to add a new event (no visible UI)

    (function(){
      const eventsEl = document.getElementById('events');
      let count = 0;

      function createEvent(text){
        count++;
        const evt = document.createElement('div');
        evt.className = 'event ' + ((count % 2 === 1) ? 'left' : 'right');

        const point = document.createElement('div');
        point.className = 'point';
        // Position the dot vertically in line with the box top + padding
        // We'll place it at the center of the box's top edge via CSS transform

        const box = document.createElement('div');
        box.className = 'box';
        box.setAttribute('contenteditable', 'true');
        box.innerText = text || ('Event ' + count);

        // When the user presses Enter inside a box, stop editing and create a new event below.
        box.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){
            e.preventDefault();
            box.blur();
            addEvent('');
          } else if(e.key === 'Escape'){
            box.blur();
          }
        });

        evt.appendChild(point);
        evt.appendChild(box);
        eventsEl.appendChild(evt);

        // Ensure the timeline scrolls so the new event is visible and the line extends
        box.scrollIntoView({behavior:'smooth', block:'center'});

        // Focus the box to edit immediately
        requestAnimationFrame(()=> box.focus());

        return evt;
      }

      window.addEvent = function(text){ return createEvent(text); };

      // Minimal key bindings (vim-like to be extended later):
      // - 'a' : add a new event below and focus it
      // - 'o' : add a new event below (alias)
      document.addEventListener('keydown', (e)=>{
        // if focused on an editable, don't intercept except for specific keys handled by the box
        const active = document.activeElement;
        const isEditing = active && active.getAttribute && active.getAttribute('contenteditable') === 'true';
        if(isEditing) return;

        if(e.key === 'a' || e.key === 'o'){
          e.preventDefault();
          addEvent('');
        }
      });

      // For demo: add a couple of starter events so you see the line extend at load
      createEvent('First event — welcome to AndThen');
      createEvent('Second event — press "a" to add a new event');

    })();
  </script>
</body>
</html>
